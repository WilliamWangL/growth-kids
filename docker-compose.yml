name: growthkids

# GrowthKids 开发环境基础设施
# 端口已错开本机其他项目：MySQL 3310 / Redis 6385 / Nginx 8090
# 生产环境编排在 TASK-020 补充（apps/web、apps/api 容器化）

services:
  mysql:
    image: mysql:8.0
    container_name: growthkids-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-growthkids-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-growthkids}
      MYSQL_USER: ${MYSQL_USER:-growthkids}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-growthkids}
      TZ: UTC
    ports:
      - "${MYSQL_PORT:-3310}:3306"
    volumes:
      - growthkids-mysql-data:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: growthkids-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "${REDIS_PORT:-6385}:6379"
    volumes:
      - growthkids-redis-data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    container_name: growthkids-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8090}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./storage:/srv/storage:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  growthkids-mysql-data:
  growthkids-redis-data:
