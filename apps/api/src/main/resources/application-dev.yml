# 开发环境配置（对应 docker/docker-compose 的专属端口，避免与其他项目冲突）
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3310}/growthkids?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:growthkids}
    password: ${MYSQL_PASSWORD:growthkids}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6385}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  auth:
    jwt-access-secret: ${JWT_ACCESS_SECRET:dev-access-secret-please-change-me-0123456789}
    jwt-refresh-secret: ${JWT_REFRESH_SECRET:dev-refresh-secret-please-change-me-0123456789}

logging:
  level:
    com.growthkids: DEBUG
