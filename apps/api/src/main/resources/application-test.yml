# 集成测试配置：使用独立的 growthkids_test 库（Flyway 自动迁移）
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3310}/growthkids_test?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:growthkids}
    password: ${MYSQL_PASSWORD:growthkids}
    hikari:
      maximum-pool-size: 5
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6385}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  auth:
    jwt-access-secret: test-access-secret-0123456789-0123456789
    jwt-refresh-secret: test-refresh-secret-0123456789-0123456789
    # 集成测试统一来自 127.0.0.1，IP 维度限流调大避免跨用例/跨次运行互相干扰；
    # 邮箱维度限流保持默认以测试暴力破解防护。
    login-max-attempts-per-ip: 1000000
  storage:
    local-path: ./target/test-storage
    signing-secret: test-storage-signing-secret-0123456789
    signed-url-ttl-seconds: 600
    photo-max-size-bytes: 10485760
  payment:
    provider: mock
    mock-signing-secret: test-payment-signing-secret-0123456789
  admin:
    # 集成测试禁用引导（用例自行提升 admin，避免种子用户干扰统计断言）
    email: ""
    password: ""

logging:
  level:
    com.growthkids: INFO
