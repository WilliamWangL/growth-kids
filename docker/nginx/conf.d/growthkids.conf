# GrowthKids 网关（开发环境）
# - /api/*  → 宿主机 8082（Spring Boot API）
# - /*      → 宿主机 3005（Next.js dev）
# - /media/ → 内部目录（X-Accel-Redirect 目标，禁止外部直接访问）
# 生产环境配置在 TASK-020 收敛（web/api 容器化 + HTTPS）。
server {
    listen 80;
    server_name _;

    # ---- API ----
    location /api/ {
        proxy_pass http://host.docker.internal:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # ---- Web ----
    location / {
        proxy_pass http://host.docker.internal:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # ---- 私有媒体（仅内部使用）----
    # API 校验签名后返回 X-Accel-Redirect: /media/{key}，由 Nginx 高效回源磁盘。
    location /media/ {
        internal;
        alias /srv/storage/;
        add_header Cache-Control "private, max-age=300";
    }
}
