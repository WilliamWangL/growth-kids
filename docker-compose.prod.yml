name: growthkids-prod

# 生产编排（TASK-020，§80）：
#   cp .env.production.example .env.production   # 填写密钥/域名
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# 仅 Nginx 暴露 80/443；MySQL/Redis/API/Web 均在内网，不映射宿主机端口。
# HTTPS 证书放置于 docker/nginx/ssl/{fullchain.pem,privkey.pem}（见 docs/PRODUCTION.md）。
# 上线前体检：bash scripts/preflight-prod.sh --env-file .env.production
# 演示商品清理：bash scripts/clean-demo-data.sh --compose --apply（V4 种子为数据而非迁移，只能清数据）

services:
  mysql:
    image: mysql:8.0
    container_name: growthkids-prod-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env.production 设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-growthkids}
      MYSQL_USER: ${MYSQL_USER:-growthkids}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env.production 设置 MYSQL_PASSWORD}
      TZ: UTC
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [internal]

  redis:
    image: redis:7-alpine
    container_name: growthkids-prod-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis-data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: growthkids-api:prod
    container_name: growthkids-prod-api
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-growthkids}
      MYSQL_USER: ${MYSQL_USER:-growthkids}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?请在 .env.production 设置 JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?请在 .env.production 设置 JWT_REFRESH_SECRET}
      STORAGE_LOCAL_PATH: /app/storage
      STORAGE_SIGNING_SECRET: ${STORAGE_SIGNING_SECRET:?请在 .env.production 设置 STORAGE_SIGNING_SECRET}
      STORAGE_URL_EXPIRY: ${STORAGE_URL_EXPIRY:-600}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      PAYMENT_MOCK_SIGNING_SECRET: ${PAYMENT_MOCK_SIGNING_SECRET:?请在 .env.production 设置 PAYMENT_MOCK_SIGNING_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-https://localhost}
      NGINX_ORIGIN: ${NGINX_ORIGIN:-https://localhost}
      # WHO 生长标准数据源。生产应指向挂载的官方 CSV（file:/data/who/...），
      # 文件缺失或校验失败会阻止启动（fail-fast，避免带着合成数据对外提供百分位）。
      # 未设置时回退镜像内置合成示例（source=growthkids-example-synthetic，仅联调可用）。
      APP_WHO_DATA_FILE: ${APP_WHO_DATA_FILE:-classpath:who-data/who-standards-example.csv}
    volumes:
      - storage-data:/app/storage
      # 官方 WHO CSV 只读挂载：宿主 ./data/who-official → 容器 /data/who
      - ./data/who-official:/data/who:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # 前端构建期注入的 API 地址：必须与站点同域（如 https://growthkids.example.com）
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?请在 .env.production 设置 NEXT_PUBLIC_API_URL}
    image: growthkids-web:prod
    container_name: growthkids-prod-web
    restart: unless-stopped
    depends_on:
      - api
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    container_name: growthkids-prod-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - ./docker/nginx/certbot-webroot:/var/www/certbot:ro
      - storage-data:/srv/storage:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks: [internal]

  # 每日数据库备份（§117）：启动先备份一次，此后每 24 小时一次；保留 30 天
  backup:
    image: mysql:8.0
    container_name: growthkids-prod-backup
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-growthkids}
      MYSQL_USER: ${MYSQL_USER:-growthkids}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ./backups:/backups
      - ./scripts/backup-mysql.sh:/scripts/backup-mysql.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "backup service: initial run then daily";
        while true; do
          /bin/sh /scripts/backup-mysql.sh || echo "backup failed";
          sleep 86400;
        done
    depends_on:
      mysql:
        condition: service_healthy
    networks: [internal]

volumes:
  mysql-data:
  redis-data:
  storage-data:

networks:
  internal:
    driver: bridge
